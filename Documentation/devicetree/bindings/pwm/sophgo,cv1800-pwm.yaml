%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/sophgo,cv1800-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sophgo CV18xx / SG200x PWM controller

maintainers:
  - Djair Guilherme da Silva Junior <djair.jr@gmail.com>

description: |
  Four PWM controllers, four channels each. Every controller has its own
  register window and 16-bit period/duty counters clocked by the PWM clock.
  The channel numbering is global: channel n of the controller at
  0x3060000 + n * 0x1000 drives PWM_<4 * n .. 4 * n + 3>.

allOf:
  - $ref: pwm.yaml#

properties:
  compatible:
    const: sophgo,cv1800-pwm

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: pwm

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sophgo,cv1800.h>

    pwm@3062000 {
        compatible = "sophgo,cv1800-pwm";
        reg = <0x03062000 0x1000>;
        clocks = <&clk CLK_PWM>;
        #pwm-cells = <3>;
    };
