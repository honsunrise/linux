%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/cvitek,cv181x-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cvitek/Sophgo CV181x (SG200x) temperature sensor

maintainers:
  - Djair Guilherme <djair.jr@gmail.com>

description: |
  The on-die temperature sensor of the CV181x family (SG2000/SG2002). It has
  one sensor and one high/low interrupt.

allOf:
  - $ref: thermal-sensor.yaml#

properties:
  compatible:
    const: cvitek,cv181x-thermal

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: clk_tempsen

  interrupts:
    maxItems: 1

  reset-names:
    const: tempsen

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#thermal-sensor-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sophgo,cv1800.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    thermal-sensor@30e0000 {
        compatible = "cvitek,cv181x-thermal";
        reg = <0x030e0000 0x10000>;
        interrupts = <16 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "tempsen";
        clocks = <&clk CLK_TEMPSEN>;
        clock-names = "clk_tempsen";
        #thermal-sensor-cells = <1>;
    };
